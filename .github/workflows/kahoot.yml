name: Kahoot monitor

on:
  workflow_dispatch:
    inputs:
      pin:
        description: "Kahoot Game PIN"
        required: true
        type: string
      name:
        description: "Participant name"
        required: true
        default: "github-monitor"
        type: string
      wait_seconds:
        description: "How long to wait for questions"
        required: true
        default: "600"
        type: string
  repository_dispatch:
    types: [kahoot_run]

permissions:
  contents: read

jobs:
  kahoot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAHOOT_PIN: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.pin || inputs.pin }}
      KAHOOT_NAME: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.name || inputs.name }}
      WAIT_SECONDS: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.wait_seconds || inputs.wait_seconds }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL || 'qwen/qwen3.8-27b' }}
      GROQ_REASONING_EFFORT: none
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Join Kahoot and monitor questions
        run: node src/kahoot-runner.cjs

      - name: Upload Kahoot event log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kahoot-events-${{ github.run_id }}
          path: artifacts/kahoot-events.ndjson
          if-no-files-found: ignore
          retention-days: 7
