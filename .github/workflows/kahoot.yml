name: Kahoot monitor

on:
  workflow_dispatch:
    inputs:
      pin:
        description: "Kahoot Game PIN"
        required: true
        type: string
      name:
        description: "Participant name"
        required: true
        default: "github-monitor"
        type: string
      wait_seconds:
        description: "How long to wait for questions"
        required: true
        default: "600"
        type: string

permissions:
  contents: read

jobs:
  kahoot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAHOOT_PIN: ${{ inputs.pin }}
      KAHOOT_NAME: ${{ inputs.name }}
      WAIT_SECONDS: ${{ inputs.wait_seconds }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL || 'llama-3.3-70b-versatile' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Join Kahoot and monitor questions
        run: node src/kahoot-runner.js

      - name: Upload Kahoot event log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kahoot-events-${{ github.run_id }}
          path: artifacts/kahoot-events.ndjson
          if-no-files-found: ignore
          retention-days: 7
